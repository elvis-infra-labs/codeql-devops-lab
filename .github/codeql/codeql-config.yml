name: "DevOps Custom CodeQL Config"

# 1. Choose the query suite
queries:
  - uses: security-extended

# 2. Paths to scan (Must be folders, use "." for repo root)
paths:
  - .

# 3. Paths to IGNORE (Fine even if folders don't exist yet)
paths-ignore:
  - tests/**
  - test/**
  - "**/*.test.py"
  - vendor/**
  - node_modules/**
  - docs/**
